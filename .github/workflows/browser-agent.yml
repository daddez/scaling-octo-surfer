name: browser-agent

# Una esecuzione = UN elenco di azioni su UNA pagina, con Safari vero (safaridriver su macOS).
# Il chiamante lancia il lavoro con workflow_dispatch e poi scarica il risultato
# dall'artifact "render-<job_id>".
run-name: browser-agent ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID univoco del lavoro (lettere, numeri, - e _)"
        required: true
        type: string
      azioni:
        description: "Lista JSON di azioni (la prima deve essere view). Vedi render.py"
        required: true
        type: string

concurrency:
  group: browser-${{ inputs.job_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abilita safaridriver (Safari reale)
        run: sudo safaridriver --enable

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      # Gli input arrivano come variabili d'ambiente, mai scritti dentro il comando:
      # nessuna possibilita' di iniettare comandi shell tramite indirizzi o selettori.
      - name: Esegui le azioni con Safari
        env:
          JOB_ID: ${{ inputs.job_id }}
          AZIONI: ${{ inputs.azioni }}
          TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY }}
        run: python render.py

      - name: Salva il risultato
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: render-${{ inputs.job_id }}
          path: render-results/
          retention-days: 7
          if-no-files-found: ignore
